name: Core CI & Pack

on:
  push:
    branches:
      - main
    paths:
      - 'TinadecCore/**'
      - 'TinadecTools/**'
      - 'TinadecTools.Generators/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/core-ci.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'TinadecCore/**'
      - 'TinadecTools/**'
      - 'TinadecTools.Generators/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/core-ci.yml'
  workflow_dispatch:

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100

      - name: Restore
        run: dotnet restore TinadecCore/TinadecCore.slnx

      - name: Build
        run: dotnet build TinadecCore/TinadecCore.slnx --no-restore

      - name: Test
        run: dotnet test TinadecCore/TinadecCore.slnx --no-build

      - name: Pack (release version from tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack TinadecCore/TinadecCore.slnx -c Release -o artifacts/nuget -p:PackageVersion=$($env:GITHUB_REF_NAME -replace '^v','')

      - name: Pack (development version)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: dotnet pack TinadecCore/TinadecCore.slnx -c Release -o artifacts/nuget

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: tinadec-core-nuget
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  publish:
    # Tag builds only; the push itself stays skipped until NUGET_API_KEY is configured.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-test-pack
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tinadec-core-nuget
          path: artifacts/nuget

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100

      - name: Push packages
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source "${{ vars.NUGET_SOURCE || 'https://api.nuget.org/v3/index.json' }}"
          --skip-duplicate

      - name: Publish skipped (NUGET_API_KEY not configured)
        if: env.NUGET_API_KEY == ''
        run: echo "NUGET_API_KEY is not configured; packages remain in the artifact only."

  posix-build-test:
    # Cross-platform POSIX verification for the full .NET surface (TinadecCore + TinadecTools).
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100

      - name: Build reviewed Bubblewrap 0.13.0 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
          BWRAP_ROOT="$RUNNER_TEMP/tinadec-bwrap"
          mkdir -p "$BWRAP_ROOT"
          curl --fail --location https://codeload.github.com/containers/bubblewrap/tar.gz/719a4fd474d44b26906bcf2b1b0fb6eddd8d56d0 --output "$BWRAP_ROOT/source.tar.gz"
          echo "e55bdb06f051664ecd3297d449a8b679b7cd1c73adb292b73a81d9b03c5fc462  $BWRAP_ROOT/source.tar.gz" | sha256sum --check
          tar -xzf "$BWRAP_ROOT/source.tar.gz" -C "$BWRAP_ROOT"
          meson setup "$BWRAP_ROOT/build" "$BWRAP_ROOT/bubblewrap-719a4fd474d44b26906bcf2b1b0fb6eddd8d56d0" -Dtests=false
          ninja -C "$BWRAP_ROOT/build"
          "$BWRAP_ROOT/build/bwrap" --version
          echo "TINADEC_TOOLS_BWRAP_PATH=$BWRAP_ROOT/build/bwrap" >> "$GITHUB_ENV"

      - name: Stage pinned ripgrep
        run: node scripts/setup-ripgrep.mjs

      - name: Restore
        run: dotnet restore TinadecOffice.slnx

      - name: Build
        run: dotnet build TinadecOffice.slnx --no-restore

      - name: Test
        run: |
          dotnet test TinadecOffice.slnx --no-build \
            --logger "console;verbosity=normal" 2>&1 | tee test-output.log
          TEST_RC=${PIPESTATUS[0]}
          if [ "$TEST_RC" -ne 0 ]; then
            echo "::error::dotnet test failed on ${{ matrix.os }} (rc=$TEST_RC)"
            exit 1
          fi
          PASSED=$(grep -oE "Passed:[[:space:]]+[0-9]+" test-output.log | awk '{s+=$2} END {print s+0}')
          echo "total passed cases: $PASSED"
          if [ "$PASSED" -lt 600 ]; then
            echo "::error::only $PASSED test cases passed on ${{ matrix.os }} (expected >= 600); POSIX gate did not really run"
            exit 1
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posix-core-test-log-${{ matrix.os }}
          path: test-output.log
          if-no-files-found: warn

  postgres-storage:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tinadec_core_test
          POSTGRES_USER: tinadec
          POSTGRES_PASSWORD: tinadec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinadec -d tinadec_core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TINADEC_TEST_POSTGRES: '1'
      TINADEC_TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=tinadec_core_test;Username=tinadec;Password=tinadec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - run: dotnet restore TinadecCore/TinadecCore.slnx
      - run: dotnet test TinadecCore/tests/TinadecCore.Api.Tests/TinadecCore.Api.Tests.csproj --no-restore --filter "FullyQualifiedName~PostgreSqlStorageTests|FullyQualifiedName~PostgreSqlScopeValidationTests|FullyQualifiedName~PostgreSqlMultiFolderWorkspaceTests" --logger "trx;LogFileName=postgres-storage.trx" -m:1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-storage-evidence
          path: TinadecCore/tests/TinadecCore.Api.Tests/TestResults/*.trx

  docker-image:
    # Keep the container image buildable; no registry push yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Core API image (no push)
        run: docker build -f TinadecCore/Api/Dockerfile -t tinadec-core-api:${{ github.sha }} .
