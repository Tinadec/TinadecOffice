name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run headless packaged Electron GUI smoke tests after packaging"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package_version: ${{ steps.meta.outputs.package_version }}
      artifact_label: ${{ steps.meta.outputs.artifact_label }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_tag_release: ${{ steps.meta.outputs.is_tag_release }}
    steps:
      - name: Check out branch source (manual dry-run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must use vX.Y.Z, received: $GITHUB_REF_NAME"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            {
              echo "package_version=${version}"
              echo "artifact_label=${version}"
              echo "release_tag=${GITHUB_REF_NAME}"
              echo "is_tag_release=true"
            } >> "$GITHUB_OUTPUT"
            echo "Prepared stable tag release ${GITHUB_REF_NAME}."
          else
            version="$(jq -r '.version // empty' apps/desktop/package.json)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version in apps/desktop/package.json: ${version}"
              exit 1
            fi
            {
              echo "package_version=${version}"
              echo "artifact_label=${version}"
              echo "release_tag=v${version}"
              echo "is_tag_release=false"
            } >> "$GITHUB_OUTPUT"
            echo "Prepared manual dry-run build for v${version} (${GITHUB_REF})."
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/_desktop-build.yml
    with:
      package_version: ${{ needs.prepare.outputs.package_version }}
      artifact_label: ${{ needs.prepare.outputs.artifact_label }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      release_channel: stable
      artifact_prefix: TinadecOffice
      retention_days: 14
      run_smoke: ${{ github.event_name != 'workflow_dispatch' || inputs.run_smoke }}
      validate_stable_tag: ${{ needs.prepare.outputs.is_tag_release == 'true' }}

  release:
    name: Publish GitHub Release
    if: needs.prepare.outputs.is_tag_release == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download verified Windows package
        uses: actions/download-artifact@v8
        with:
          name: TinadecOffice-win-x64
          path: release-artifacts

      - name: Download verified Linux package
        uses: actions/download-artifact@v8
        with:
          name: TinadecOffice-linux-x64
          path: release-artifacts

      - name: Download verified macOS package
        uses: actions/download-artifact@v8
        with:
          name: TinadecOffice-osx-arm64
          path: release-artifacts

      - name: Merge the Office channel catalogs
        env:
          OFFICE_RELEASE_VERSION: ${{ needs.prepare.outputs.package_version }}
          OFFICE_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          OFFICE_RELEASE_CHANNEL: stable
        run: node apps/desktop/scripts/merge-office-channel-catalog.mjs release-artifacts/office-channel

      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        run: find . -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Validate Office channel catalog
        working-directory: release-artifacts
        run: |
          test -s office-channel/catalog.json
          test "$(find office-channel -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          test "$(find office-channel -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 8
          test "$(find office-channel -maxdepth 1 -name 'catalog-*.json' | wc -l)" -eq 3
          jq -e '.schemaVersion == 1
            and (.products | length >= 5)
            and (([.products[].releases[0].channel] | unique) == ["stable"])
            and (([.products[].releases[0].artifacts | length] | min) >= 3)
            and ((([.products[].releases[0].artifacts[].platform] | unique)) | contains(["linux", "macos", "windows"]))' office-channel/catalog.json >/dev/null

      - name: Compose release notes
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-body.mjs "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub Release
        working-directory: release-artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" SHA256SUMS
          $(find . -type f ! -name 'SHA256SUMS' -print | sort)
          --verify-tag
          --latest
          --notes-file "$RUNNER_TEMP/release-body.md"
          --title "TinadecOffice $GITHUB_REF_NAME"
