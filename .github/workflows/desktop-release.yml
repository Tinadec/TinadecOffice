name: Desktop release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/desktop/**'
      - 'apps/TinadecUI/**'
      - 'TinadecCore/**'
      - 'TinadecGateway/**'
      - 'TinadecTools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/create-version.yml'
      - 'apps/desktop/scripts/package-office-channel.mjs'
      - 'apps/desktop/scripts/verify-office-channel.mjs'
      - 'apps/desktop/scripts/merge-office-channel-catalog.mjs'
      - 'apps/desktop/scripts/officeChannel.mjs'
      - 'apps/desktop/scripts/runtimeTargets.mjs'
      - 'docs/tinadec-office-release-contract.zh-CN.md'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/TinadecUI/**'
      - 'TinadecCore/**'
      - 'TinadecGateway/**'
      - 'TinadecTools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/create-version.yml'
      - 'apps/desktop/scripts/package-office-channel.mjs'
      - 'apps/desktop/scripts/verify-office-channel.mjs'
      - 'apps/desktop/scripts/merge-office-channel-catalog.mjs'
      - 'apps/desktop/scripts/officeChannel.mjs'
      - 'apps/desktop/scripts/runtimeTargets.mjs'
      - 'docs/tinadec-office-release-contract.zh-CN.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # A red macOS leg must not hide whether Linux produced a working .deb: every leg reports
      # for itself, so fail-fast is off.
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: win-x64
            packageScript: package:win
          - os: ubuntu-24.04
            label: linux-x64
            packageScript: package:linux
          - os: macos-15
            label: osx-arm64
            packageScript: package:mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    #v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   #v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  #v6.0.0
        with:
          dotnet-version: 10.0.300
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6   #v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache downloaded desktop runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9       #v6.1.0
        with:
          path: apps/desktop/.runtime-cache/downloads
          key: desktop-runtime-${{ runner.os }}-${{ hashFiles('apps/desktop/scripts/stage-runtime.mjs', 'scripts/ripgrep-pin.mjs') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use vX.Y.Z: $env:GITHUB_REF_NAME"
          }
          $packageVersion = node -p "require('./apps/desktop/package.json').version"
          if ($packageVersion -ne $tagVersion) {
            throw "Desktop version $packageVersion does not match tag $env:GITHUB_REF_NAME"
          }

      - name: Install Node.js workspace dependencies
        run: npm ci

      - name: Install Gateway dependencies
        working-directory: TinadecGateway
        run: bun install --frozen-lockfile

      - name: Test Desktop
        run: npm test -w @tinadec/desktop

      - name: Typecheck Desktop
        run: npm run typecheck -w @tinadec/desktop

      - name: Test Gateway
        working-directory: TinadecGateway
        run: bun test src

      - name: Build and package the application
        # The stager resolves the target from the runner itself, so no leg can stage a runtime for
        # another platform; the leg name is what the runner is, not what someone typed.
        run: npm run ${{ matrix.packageScript }} -w @tinadec/desktop

      - name: Verify package output
        if: matrix.label == 'win-x64'
        run: npm run verify:package -w @tinadec/desktop

      # The installer is the deliverable, and nothing here can install it: read the archive the way
      # a package manager would and check that the launcher, the binary and the icon name each other.
      - name: Check the Linux package contents
        if: matrix.label == 'linux-x64'
        run: npm run check:deb -w @tinadec/desktop

      # Electron needs an X server and its shared libraries on a headless runner; without the
      # packages the app dies before it binds a port, and the smoke's own message would be a
      # timeout rather than "libgtk-3 is missing".
      - name: Install the libraries Electron needs on a headless runner
        if: matrix.label == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libasound2t64 libgtk-3-0t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2

      - name: Smoke test the packaged application (Linux)
        if: matrix.label == 'linux-x64'
        # -ac, not just an X server: the smoke redirects HOME to a throwaway profile, so the Xlib
        # default cookie lookup ($HOME/.Xauthority) cannot find the authority xvfb-run wrote, and
        # Electron dies with "Authorization required, but no authorization protocol specified"
        # followed by SIGSEGV before it binds a port.
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x1024x24 -ac"
          npm run smoke:packaged:posix -w @tinadec/desktop

      # The .deb is what ships, and so far only `ar`/`tar` had ever read it. Let the package manager
      # resolve its Depends and lay it under /opt, then run that file: a deb whose dependency list
      # names a library Ubuntu 24.04 renamed installs fine from a directory nobody installs from.
      - name: Install the .deb the way a user would
        if: matrix.label == 'linux-x64'
        run: |
          set -e
          deb=$(ls apps/desktop/release/*-linux-x64.deb)
          sudo apt-get install -y --no-install-recommends "./$deb"
          pkg=$(dpkg-deb -f "$deb" Package)
          dpkg-query -W -f='installed ${Package} ${Version} ${Architecture}\n' "$pkg"
          test -x /opt/TinadecOffice/TinadecOffice || { echo '/opt after install:'; ls -l /opt; exit 1; }

      - name: Smoke test the installed application (Linux)
        if: matrix.label == 'linux-x64'
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x1024x24 -ac"
          npm run smoke:packaged:posix -w @tinadec/desktop --
          --executable=/opt/TinadecOffice/TinadecOffice --label="linux-x64 installed"

      # The macOS smoke mounts the .dmg and runs the binary inside it, so this step is the evidence
      # that the shipped artifact — not just the directory that fed the packager — starts.
      - name: Smoke test the packaged application (macOS)
        if: matrix.label == 'osx-arm64'
        run: npm run smoke:packaged:posix -w @tinadec/desktop

      - name: Smoke test unpacked application
        if: matrix.label == 'win-x64'
        run: npm run smoke:packaged -w @tinadec/desktop

      - name: Smoke test installed application
        if: matrix.label == 'win-x64'
        run: npm run smoke:installed -w @tinadec/desktop

      # Every leg packs its own channel: staging is native-only, so the Windows leg has never seen a
      # Linux runtime and the Linux leg cannot read a zip. The merged catalog is the release job's job.
      - name: Package Office channel artifacts
        run: node apps/desktop/scripts/package-office-channel.mjs

      - name: Verify Office channel artifacts
        run: node apps/desktop/scripts/verify-office-channel.mjs

      # The leg-local office-channel/SHA256SUMS is a build gate, not a release asset: three legs each
      # writing that one name into one artifact set would silently keep only the last, and the
      # published sums come from the release job instead.
      - name: Upload Windows package
        if: matrix.label == 'win-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: TinadecOffice-win-x64
          path: |
            apps/desktop/release/*-win-x64-setup.exe
            apps/desktop/release/*-win-x64-setup.exe.blockmap
            apps/desktop/release/*-win-x64-portable.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/office-channel/*.zip
            apps/desktop/release/office-channel/catalog-win-x64.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux package
        if: matrix.label == 'linux-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: TinadecOffice-linux-x64
          path: |
            apps/desktop/release/*-linux-x64.deb
            apps/desktop/release/office-channel/*.tar.gz
            apps/desktop/release/office-channel/catalog-linux-x64.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS package
        if: matrix.label == 'osx-arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: TinadecOffice-osx-arm64
          path: |
            apps/desktop/release/*-osx-arm64.dmg
            apps/desktop/release/office-channel/*.tar.gz
            apps/desktop/release/office-channel/catalog-osx-arm64.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The merge command is the only writer of catalog.json, and it has to run somewhere that can see
      # all three legs — which is this job, after the downloads, and nowhere else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    #v7.0.1

      - name: Download verified Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: TinadecOffice-win-x64
          path: release-artifacts

      - name: Download verified Linux package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: TinadecOffice-linux-x64
          path: release-artifacts

      - name: Download verified macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: TinadecOffice-osx-arm64
          path: release-artifacts

      - name: Merge the Office channel catalogs
        env:
          OFFICE_RELEASE_VERSION: ${{ github.ref_name }}
        run: node apps/desktop/scripts/merge-office-channel-catalog.mjs release-artifacts/office-channel

      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        # The published release must carry one sums file covering every published
        # asset. Measured against a simulated artifact layout, the previous find
        # uploaded office-channel/SHA256SUMS (a build-job gate that lists only the
        # four module zips and the catalog) as the release's "SHA256SUMS", while
        # excluding the generated top-level file — so the installers shipped with
        # no checksums. Skip every SHA256SUMS in the scan and publish the top-level
        # one explicitly.
        run: find . -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Validate Office channel catalog
        working-directory: release-artifacts
        # 4 archives per platform (core, gateway, tools, agentpack): one zip on Windows, tar.gz on
        # the two POSIX legs, because GNU tar writes a tar archive when told to make a zip. The jq
        # expression stays in the single-argument, min/max form: this job is the release gate, and an
        # expression that fails to parse here looks like a broken publisher rather than a bad catalog.
        run: |
          test -s office-channel/catalog.json
          test "$(find office-channel -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          test "$(find office-channel -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 8
          test "$(find office-channel -maxdepth 1 -name 'catalog-*.json' | wc -l)" -eq 3
          jq -e '.schemaVersion == 1
            and (.products | length >= 5)
            and (([.products[].releases[0].artifacts | length] | min) >= 3)
            and ((([.products[].releases[0].artifacts[].platform] | unique)) | contains(["linux", "macos", "windows"]))' office-channel/catalog.json >/dev/null

      - name: Create GitHub Release
        working-directory: release-artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" SHA256SUMS
          $(find . -type f ! -name 'SHA256SUMS' -print | sort)
          --verify-tag
          --generate-notes
          --title "TinadecOffice $GITHUB_REF_NAME"
