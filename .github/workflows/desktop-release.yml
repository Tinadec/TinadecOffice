name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run headless packaged Electron GUI smoke tests after packaging"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: win-x64
            packageScript: package:win
          - os: ubuntu-24.04
            label: linux-x64
            packageScript: package:linux
          - os: macos-15
            label: osx-arm64
            packageScript: package:mac
            # Bundling Mermaid/KaTeX/Monaco exceeds Node's default 2 GB heap on macOS arm64.
            nodeOptions: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100
          cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache downloaded desktop runtimes
        uses: actions/cache@v6
        with:
          path: apps/desktop/.runtime-cache/downloads
          key: desktop-runtime-${{ runner.os }}-${{ hashFiles('apps/desktop/scripts/stage-runtime.mjs', 'scripts/ripgrep-pin.mjs') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME || "";
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error(`Release tags must use vX.Y.Z, received: ${tag}`);
            }
            const tagVersion = tag.slice(1);
            const pkgVersion = require("./apps/desktop/package.json").version;
            if (pkgVersion !== tagVersion) {
              throw new Error(`apps/desktop/package.json (${pkgVersion}) does not match tag ${tag}`);
            }
            console.log(`Validated release version ${tagVersion}.`);
          '

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Cache reviewed Linux Bubblewrap
        id: bwrap-cache
        if: matrix.label == 'linux-x64'
        uses: actions/cache@v6
        with:
          path: native/bwrap
          key: bwrap-${{ runner.os }}-${{ hashFiles('scripts/bubblewrap-pin.mjs') }}

      - name: Install Bubblewrap build dependencies (Linux cache miss)
        if: matrix.label == 'linux-x64' && steps.bwrap-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config libcap-dev

      - name: Stage reviewed Linux Bubblewrap
        if: matrix.label == 'linux-x64'
        run: bun run setup:bwrap

      - name: Build and package the application
        env:
          NODE_OPTIONS: ${{ matrix.nodeOptions }}
        # Stages native Core/Gateway/Tools/rg (+ PortableGit on Windows / bwrap on Linux),
        # checks binary formats & entrypoints, typechecks & builds Desktop, and runs electron-builder.
        run: bun run --cwd apps/desktop ${{ matrix.packageScript }}

      - name: Verify Windows package output
        if: matrix.label == 'win-x64'
        run: bun run --cwd apps/desktop verify:package

      - name: Check Linux .deb package contents
        if: matrix.label == 'linux-x64'
        run: bun run --cwd apps/desktop check:deb

      - name: Install headless Electron libraries (optional smoke)
        if: matrix.label == 'linux-x64' && github.event_name == 'workflow_dispatch' && inputs.run_smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libasound2t64 libgtk-3-0t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2

      - name: Smoke test packaged Linux application (optional)
        if: matrix.label == 'linux-x64' && github.event_name == 'workflow_dispatch' && inputs.run_smoke
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x1024x24 -ac"
          bun run --cwd apps/desktop smoke:packaged:posix

      - name: Smoke test packaged macOS application (optional)
        if: matrix.label == 'osx-arm64' && github.event_name == 'workflow_dispatch' && inputs.run_smoke
        run: bun run --cwd apps/desktop smoke:packaged:posix

      - name: Smoke test packaged Windows application (optional)
        if: matrix.label == 'win-x64' && github.event_name == 'workflow_dispatch' && inputs.run_smoke
        run: bun run --cwd apps/desktop smoke:packaged

      - name: Package Office channel artifacts
        run: node apps/desktop/scripts/package-office-channel.mjs

      - name: Verify Office channel artifacts
        run: node apps/desktop/scripts/verify-office-channel.mjs

      - name: Upload Windows package
        if: matrix.label == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: TinadecOffice-win-x64
          path: |
            apps/desktop/release/*-win-x64-setup.exe
            apps/desktop/release/*-win-x64-setup.exe.blockmap
            apps/desktop/release/*-win-x64-portable.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/office-channel/*.zip
            apps/desktop/release/office-channel/catalog-win-x64.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux package
        if: matrix.label == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: TinadecOffice-linux-x64
          path: |
            apps/desktop/release/*-linux-x64.deb
            apps/desktop/release/office-channel/*.tar.gz
            apps/desktop/release/office-channel/catalog-linux-x64.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS package
        if: matrix.label == 'osx-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: TinadecOffice-osx-arm64
          path: |
            apps/desktop/release/*-osx-arm64.dmg
            apps/desktop/release/office-channel/*.tar.gz
            apps/desktop/release/office-channel/catalog-osx-arm64.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download verified Windows package
        uses: actions/download-artifact@v8
        with:
          name: TinadecOffice-win-x64
          path: release-artifacts

      - name: Download verified Linux package
        uses: actions/download-artifact@v8
        with:
          name: TinadecOffice-linux-x64
          path: release-artifacts

      - name: Download verified macOS package
        uses: actions/download-artifact@v8
        with:
          name: TinadecOffice-osx-arm64
          path: release-artifacts

      - name: Merge the Office channel catalogs
        env:
          OFFICE_RELEASE_VERSION: ${{ github.ref_name }}
        run: node apps/desktop/scripts/merge-office-channel-catalog.mjs release-artifacts/office-channel

      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        run: find . -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Validate Office channel catalog
        working-directory: release-artifacts
        run: |
          test -s office-channel/catalog.json
          test "$(find office-channel -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          test "$(find office-channel -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 8
          test "$(find office-channel -maxdepth 1 -name 'catalog-*.json' | wc -l)" -eq 3
          jq -e '.schemaVersion == 1
            and (.products | length >= 5)
            and (([.products[].releases[0].artifacts | length] | min) >= 3)
            and ((([.products[].releases[0].artifacts[].platform] | unique)) | contains(["linux", "macos", "windows"]))' office-channel/catalog.json >/dev/null

      - name: Compose release notes
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-body.mjs "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub Release
        working-directory: release-artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" SHA256SUMS
          $(find . -type f ! -name 'SHA256SUMS' -print | sort)
          --verify-tag
          --notes-file "$RUNNER_TEMP/release-body.md"
          --title "TinadecOffice $GITHUB_REF_NAME"
