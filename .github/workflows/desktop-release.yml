name: Desktop release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/desktop/**'
      - 'apps/TinadecUI/**'
      - 'TinadecCore/**'
      - 'TinadecGateway/**'
      - 'TinadecTools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/TinadecUI/**'
      - 'TinadecCore/**'
      - 'TinadecGateway/**'
      - 'TinadecTools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
          cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache downloaded desktop runtimes
        uses: actions/cache@v4
        with:
          path: apps/desktop/.runtime-cache/downloads
          key: desktop-runtime-${{ runner.os }}-${{ hashFiles('apps/desktop/scripts/stage-runtime.mjs') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use vX.Y.Z: $env:GITHUB_REF_NAME"
          }
          $packageVersion = node -p "require('./apps/desktop/package.json').version"
          if ($packageVersion -ne $tagVersion) {
            throw "Desktop version $packageVersion does not match tag $env:GITHUB_REF_NAME"
          }

      - name: Install Node.js workspace dependencies
        run: npm ci

      - name: Install Gateway dependencies
        working-directory: TinadecGateway
        run: bun install --frozen-lockfile

      - name: Test Desktop
        run: npm test -w @tinadec/desktop

      - name: Typecheck Desktop
        run: npm run typecheck -w @tinadec/desktop

      - name: Test Gateway
        working-directory: TinadecGateway
        run: bun test src

      - name: Build and package Windows application
        run: npm run package:win -w @tinadec/desktop

      - name: Verify package output
        run: npm run verify:package -w @tinadec/desktop

      - name: Smoke test unpacked application
        run: npm run smoke:packaged -w @tinadec/desktop

      - name: Smoke test installed application
        run: npm run smoke:installed -w @tinadec/desktop

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TinadecOffice-windows-x64
          path: |
            apps/desktop/release/*-win-x64-setup.exe
            apps/desktop/release/*-win-x64-setup.exe.blockmap
            apps/desktop/release/*-win-x64-portable.exe
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: TinadecOffice-windows-x64
          path: release-artifacts

      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        run: sha256sum ./* > SHA256SUMS

      - name: Create GitHub Release
        working-directory: release-artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" ./*
          --verify-tag
          --generate-notes
          --title "TinadecOffice $GITHUB_REF_NAME"
