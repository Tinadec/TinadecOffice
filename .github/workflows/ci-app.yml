name: CI — App Layer

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-app.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_dist_artifact:
        description: "Upload built apps/desktop/dist artifact for downstream packaging"
        type: boolean
        required: false
        default: false
      dist_artifact_name:
        description: "Artifact name when upload_dist_artifact is true"
        type: string
        required: false
        default: 'desktop-dist'

permissions:
  contents: read

concurrency:
  group: ci-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App Layer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run App Layer checks and builds in parallel
        shell: bash
        run: |
          set -euo pipefail
          log_dir="${RUNNER_TEMP}/ci-app"
          mkdir -p "$log_dir"

          names=()
          pids=()

          run_task() {
            local name="$1"
            shift
            names+=("$name")
            (
              "$@"
            ) >"${log_dir}/${name}.log" 2>&1 &
            pids+=("$!")
          }

          run_task "check-dependencies" bun scripts/check-dependencies.mjs
          run_task "test:scripts" bun run test:scripts
          run_task "TinadecUI-test" bun run --cwd apps/TinadecUI test
          run_task "desktop-test" bun run --cwd apps/desktop test
          run_task "desktop-typecheck" bun run --cwd apps/desktop typecheck
          run_task "desktop-build-vite" bun run --cwd apps/desktop build:vite
          run_task "web-build" bun run --cwd apps/web build

          failed=()
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            pid="${pids[$i]}"
            log_file="${log_dir}/${name}.log"
            status=0
            wait "$pid" || status=$?
            echo "::group::${name} (exit ${status})"
            cat "$log_file"
            echo "::endgroup::"
            if (( status != 0 )); then
              echo "::error::Task '${name}' failed with exit code ${status}."
              failed+=("${name}(${status})")
            fi
          done

          if (( ${#failed[@]} > 0 )); then
            echo "::error::App Layer failed tasks: ${failed[*]}"
            exit 1
          fi

      - name: Upload Desktop frontend dist
        if: inputs.upload_dist_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dist_artifact_name }}
          path: apps/desktop/dist
          retention-days: 1
          if-no-files-found: error
