name: Contract drift gates

on:
  pull_request:
    paths:
      - 'TinadecGateway/src/**'
      - 'TinadecGateway/tests/__snapshots__/**'
      - 'TinadecGateway/package.json'
      - 'TinadecGateway/bun.lock*'
      - 'apps/desktop/src/generated/**'
      - 'apps/desktop/package.json'
      - '.github/workflows/contracts-drift.yml'
  push:
    paths:
      - 'TinadecGateway/src/**'
      - 'TinadecGateway/tests/__snapshots__/**'
      - 'TinadecGateway/package.json'
      - 'TinadecGateway/bun.lock*'
      - 'apps/desktop/src/generated/**'
      - 'apps/desktop/package.json'
      - '.github/workflows/contracts-drift.yml'

jobs:
  gateway-openapi-snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TinadecGateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    #v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6   #v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # openapi.snapshot.test.ts rewrites tests/__snapshots__/openapi.external.json;
      # the gate is a clean git diff afterwards.
      - run: bun test src
      - run: git diff --exit-code -- tests/__snapshots__/

  desktop-generated-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   #v7.0.0
        with:
          node-version: 24
      # check:drift regenerates src/generated/schema.d.ts from the Gateway
      # OpenAPI snapshot via npx (no node_modules needed) and fails on diff.
      - run: npm run check:drift
