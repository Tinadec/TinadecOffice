name: Create Office version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        required: true
        type: string
      source_branch:
        description: "Branch or commit to tag"
        required: true
        default: main
        type: string

permissions:
  contents: write
  # Needed to start desktop-release.yml for the tag this job just pushed.
  actions: write

concurrency:
  group: create-office-version
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  create-tag:
    name: Create v${{ inputs.version }} tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    #v7.0.1
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Validate release version
        id: validate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use X.Y.Z SemVer, received: $RELEASE_VERSION"
            exit 1
          fi

          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$desktop_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::apps/desktop/package.json is $desktop_version, expected $RELEASE_VERSION"
            echo "::error::Update the desktop version in a reviewed commit before creating the tag."
            exit 1
          fi

          if git ls-remote --exit-code --refs origin "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${RELEASE_VERSION} already exists on origin."
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Creating v${RELEASE_VERSION} from $(git rev-parse HEAD)."

      - name: Create annotated release tag
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          SOURCE_SHA: ${{ steps.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git tag --annotate "v${RELEASE_VERSION}" "$SOURCE_SHA" --message "TinadecOffice v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"
          echo "Created and pushed v${RELEASE_VERSION}."

      # Pushing the tag does not start the release on its own. desktop-release.yml filters push events
      # with `paths:`, and a tag created at the current tip has no changed-file list for that filter to
      # match, so GitHub drops the event without a trace — measured with v0.2.0: the tag landed, no run
      # appeared, and only an explicit dispatch on the tag ref built and published it. Dispatch it here
      # by name, so "tagged it, nothing happened" is not the release procedure.
      - name: Start the release build for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run desktop-release.yml --ref "v${RELEASE_VERSION}"
          echo "Dispatched desktop-release.yml on v${RELEASE_VERSION}."
