# TinadecCore dual-layer runtime baseline.
#
# This file is a read-only built-in baseline. Workspace-scoped database versions
# may override profiles, but every run freezes the resolved config version/hash.
# A valid edit is hot-reloaded for new runs only. Invalid edits keep the previous
# snapshot active and appear in readiness diagnostics.

schema_version = 1

[spawn]
# Maximum parent -> child generation depth. A root operation agent is depth 0.
max_depth = 2
# Maximum generated (non-profile) agent instances in one run.
max_agents_per_run = 8
# Maximum simultaneously running execution workers in one run.
max_parallel_workers = 4

[scheduling]
# Multiple top-level runs may stay active in one session, subject to this limit.
max_active_runs_per_session = 2
worker_retry_limit = 2
preserve_partial_results = true

[supervision]
required_before_final = true
max_revision_rounds = 2

[context]
# Used only when the resolved model does not publish a smaller context budget.
default_token_budget = 8192
recent_message_limit = 24
optimistic_revision = true

[memory]
candidate_only = true
retrieval_limit = 8
allowed_scopes = ["principal", "workspace", "project", "agent"]
allowed_kinds = ["fact", "preference", "decision", "success_pattern", "failure_pattern", "task_template", "supervision_rule"]

[tools]
provider = "tinadec-tools-process"
mutation_requires_approval = true
serialize_workspace_writes = true
default_timeout_seconds = 120
# Maximum tool-call rounds an execution worker may chain before it must
# converge to a textual conclusion.
max_tool_rounds = 4

# Application modes decide which agent-mode choices the UI may present.
[application_modes.conversation]
default_agent_mode = "auto"
allowed_agent_modes = ["plan", "spec", "ask", "vibe", "auto", "agent"]

[application_modes.conversation.bindings]
plan = "conversation.plan"
spec = "conversation.spec"
ask = "conversation.ask"
vibe = "conversation.vibe"
auto = "conversation.auto"
agent = "conversation.agent"

[application_modes.space]
default_agent_mode = "agent"
allowed_agent_modes = ["agent"]

[application_modes.space.bindings]
agent = "space.full_duplex"

# Every profile preserves the operation/execution architecture. The activation
# policy decides which roles are used for a specific turn.
[profiles."conversation.ask"]
activation_policy = "intent_adaptive"
operation_agents = ["meeting"]
execution_agents = ["task_planner"]
direct_answer_allowed = true

[profiles."conversation.plan"]
activation_policy = "plan_only"
operation_agents = ["meeting", "context_compressor", "supervisor"]
execution_agents = ["task_planner"]
direct_answer_allowed = false

[profiles."conversation.spec"]
activation_policy = "specification"
operation_agents = ["meeting", "context_compressor", "supervisor"]
execution_agents = ["task_planner"]
direct_answer_allowed = false

[profiles."conversation.vibe"]
activation_policy = "intent_adaptive"
operation_agents = ["meeting"]
execution_agents = ["task_planner"]
direct_answer_allowed = true

[profiles."conversation.auto"]
activation_policy = "intent_adaptive"
operation_agents = ["meeting", "context_compressor", "skill_recommender", "supervisor"]
execution_agents = ["task_planner"]
direct_answer_allowed = true

[profiles."conversation.agent"]
activation_policy = "execute"
operation_agents = ["meeting", "context_compressor", "skill_recommender", "supervisor", "evolution"]
execution_agents = ["task_planner"]
direct_answer_allowed = false

[profiles."space.full_duplex"]
activation_policy = "full_duplex"
operation_agents = ["meeting", "context_compressor", "skill_recommender", "supervisor", "evolution"]
execution_agents = ["task_planner"]
direct_answer_allowed = false

# Built-in operation-layer roles. Only meeting may emit user-facing messages.
[agents.meeting]
layer = "operation"
role = "session_coordinator"
lifecycle = "session"
capabilities = ["user.respond", "task.dispatch", "agent.spawn"]
direct_user_output = true
context_access = "manage"

[agents.context_compressor]
layer = "operation"
role = "context_maintenance"
lifecycle = "session_background"
capabilities = ["context.read", "context.patch"]
direct_user_output = false
context_access = "patch"

[agents.skill_recommender]
layer = "operation"
role = "capability_advisor"
lifecycle = "on_demand"
capabilities = ["tool.search", "agent.propose"]
direct_user_output = false
context_access = "read"

[agents.supervisor]
layer = "operation"
role = "quality_controller"
lifecycle = "task"
capabilities = ["supervision.review"]
direct_user_output = false
context_access = "read"

[agents.evolution]
layer = "operation"
role = "experience_curator"
lifecycle = "post_task_background"
capabilities = ["memory.candidate", "agent.candidate"]
direct_user_output = false
context_access = "read"

[agents.task_planner]
layer = "execution"
role = "execution_coordinator"
lifecycle = "task"
capabilities = ["task.plan", "task.replan", "agent.spawn"]
# The planner may delegate any tool declared by the trusted v2 manifest. Each
# generated worker is still narrowed to its task's required tool ids.
allowed_tools = ["*"]
direct_user_output = false
context_access = "read_patch"
